name: Verify and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_SCRIPT_URL: ${{ vars.VITE_GOOGLE_SCRIPT_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm run setup
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Verify Apps Script deployment
        run: node scripts/verify-google-script.js
      - name: Run tests
        run: npm test
      - name: Test staff dashboard
        run: npm run test:staff
        env:
          CI: true
      - name: Build Pages site and staff dashboard
        run: npm run build:pages
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_SCRIPT_URL: ${{ vars.VITE_GOOGLE_SCRIPT_URL }}
          PUBLIC_URL: /MandirTickets/staff
          REACT_APP_REQUEST_SITE_URL: /MandirTickets/
          REACT_APP_WORKSHOP_API_URL: ${{ vars.STAFF_API_URL }}
          REACT_APP_GOOGLE_SCRIPT_URL: ${{ vars.VITE_GOOGLE_SCRIPT_URL }}
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify-and-build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
